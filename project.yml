# Описание проекта для XcodeGen: `xcodegen generate` создаёт School21.xcodeproj (в git он не хранится).
name: School21
options:
  bundleIdPrefix: ru.school21
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  School21:
    type: application
    platform: iOS
    sources:
      - path: School21
      - path: Shared
    info:
      path: School21/Info.plist
      properties:
        CFBundleDisplayName: School 21
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - ru.school21.ios.refresh
        UIStatusBarStyle: UIStatusBarStyleLightContent
    entitlements:
      path: School21/School21.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ru.school21.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.school21.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: School21Widget
    # Общая схема — нужна xcodebuild в CI.
    scheme:
      gatherCoverageData: false

  School21Widget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: School 21
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ru.school21.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.school21.ios.widget
        TARGETED_DEVICE_FAMILY: "1,2"
