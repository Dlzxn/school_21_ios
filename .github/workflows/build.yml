# Сборка .ipa на macOS-раннере GitHub (без платного аккаунта разработчика).
# IPA не подписан сертификатом: его подписывает AltStore/SideStore вашим Apple ID при установке.
# ldid ставит в бинарники entitlements (App Group для виджета), чтобы AltStore их перенёс.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project School21.xcodeproj -scheme School21 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/School21.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning: .*School21|\*\* (ARCHIVE|BUILD)" || true
          test -d build/School21.xcarchive/Products/Applications/School21.app

      - name: Package IPA
        run: |
          APP=build/School21.xcarchive/Products/Applications/School21.app
          ldid -SWidget/Widget.entitlements "$APP/PlugIns/School21Widget.appex/School21Widget"
          ldid -SSchool21/School21.entitlements "$APP/School21"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry School21.ipa Payload
          ls -la School21.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: School21-ipa
          path: School21.ipa

      - name: Build log on failure
        if: failure()
        run: grep -E "error:" -A3 build.log | head -80 || true

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: School21.ipa
